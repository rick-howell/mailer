<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Contact me</h1>
  <form id="contact-form">
    <input type="text" id="name" placeholder="Your name" required />
    <input type="email" id="email" placeholder="Your email" required />
    <textarea id="message" rows="5" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
  <div id="status"></div>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Sending...';

      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
      };

      try {
        const res = await fetch('/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        status.textContent = res.ok ? 'Message sent!' : `Error: ${data.error}`;
        if (res.ok) form.reset();
      } catch (err) {
        status.textContent = 'Network error. Is the server running?';
      }
    });
  </script>
</body>
</html>
